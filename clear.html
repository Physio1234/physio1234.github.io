<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cache leeren - Am Sachsenwald</title>
<style>
body{font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#1a4a82;color:#fff;text-align:center;padding:20px}
.box{max-width:400px}
h1{font-size:1.5rem;margin-bottom:16px}
p{font-size:1rem;opacity:.85;line-height:1.6;margin-bottom:24px}
.status{font-size:1.1rem;font-weight:bold;margin:20px 0;min-height:28px}
.btn{display:inline-block;background:#fff;color:#1a4a82;padding:14px 32px;border-radius:25px;font-size:1rem;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-family:Arial,sans-serif}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <h1>&#128260; Cache & Service Worker l&ouml;schen</h1>
  <p>Dies l&ouml;scht alle alten Seiten-Caches und Service Worker, damit die neue Website korrekt angezeigt wird.</p>
  <div class="status" id="status"><span class="spinner"></span>L&auml;dt...</div>
  <br/>
  <a href="/" class="btn" id="homeBtn" style="display:none">&#127968; Zur Startseite</a>
</div>
<script>
(function(){
  var status = document.getElementById('status');
  var btn = document.getElementById('homeBtn');
  
  function done(msg){
    status.innerHTML = '&#10003; ' + msg;
    btn.style.display = 'inline-block';
  }
  
  function fail(msg){
    status.innerHTML = '&#10005; ' + msg;
    btn.style.display = 'inline-block';
  }
  
  if(!('serviceWorker' in navigator)){
    done('Fertig! Kein Service Worker gefunden.');
    return;
  }
  
  var tasks = [];
  
  // Kill all service workers
  var swTask = navigator.serviceWorker.getRegistrations().then(function(regs){
    return Promise.all(regs.map(function(r){ return r.unregister(); }));
  });
  tasks.push(swTask);
  
  // Clear all caches
  if('caches' in window){
    var cacheTask = caches.keys().then(function(names){
      return Promise.all(names.map(function(n){ return caches.delete(n); }));
    });
    tasks.push(cacheTask);
  }
  
  Promise.all(tasks).then(function(){
    done('Fertig! Alles gel&ouml;scht. Klicken Sie jetzt auf Startseite.');
  }).catch(function(){
    fail('Fehler. Bitte Seite neu laden und erneut versuchen.');
  });
})();
</script>
</body>
</html>
